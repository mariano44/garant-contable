<div class="row w-100 mx-0 auth-page">
  <div class="col-md-8 col-xl-6 mx-auto">
    <div class="card">
      <div class="row">
        <div class="col-md-4 pr-md-0">
          <div class="auth-left-wrapper">
          </div>
        </div>
        <div class="col-md-8 pl-md-0">          
          <div class="auth-form-wrapper px-4 py-5"> 
            <div class="text-center mb-3">
              <img src="../../../../../assets/images/garantlogo.png" />
            </div>
            <h5 class="text-muted font-weight-normal mb-4">Bienvenido! Ingresa a tu cuenta.</h5>
            <form class="forms-sample">
              <div class="form-group">
                <label for="exampleInputEmail1">Correo Electrónico</label>
                <input type="email" [(ngModel)]="correo" (keyup.enter)="EnterSubmit($event)" [ngModelOptions]="{standalone: true}" class="form-control" id="exampleInputEmail1" placeholder="ejemplo@dominio.com" value="">
              </div>
              <div class="form-group">
                <label for="exampleInputPassword1">Contraseña</label>
                <div class="input-group-append">
                  <input [type]="passwordType" [(ngModel)]="password" (keyup.enter)="EnterSubmit($event)" [ngModelOptions]="{standalone: true}" class="form-control" id="exampleInputPassword1" autocomplete="current-password" placeholder="Contraseña" value="">
                  <button class="btn btn-outline-primary btn-icon eye-off" type="button" (click)="hideShowPassword()">
                    <i [ngClass]="{'icon-eye-off': !hide,'icon-eye': hide}" class="feather"></i>
                  </button>
                </div>
              </div>
              <div class="mt-3">
                <button type="submit" [disabled]="clicked" class="btn btn-primary mr-2 mb-2 mb-md-0" (click)="onLoggedin($event)">
                  <span *ngIf="clicked" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                  {{text}}
                </button>                
              </div>              
              <a routerLink="/auth/cambiarcontrasenia" class="d-block mt-3 text-muted">¿No recuerdas tu contraseña?</a>  
             
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
