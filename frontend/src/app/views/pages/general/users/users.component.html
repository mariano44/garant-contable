<div class="row">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item active" aria-current="page">Usuarios</li>
    </ol>
  </nav>
</div>
<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
  <div class="col-md-12">
    <ul ngbNav #defaultNav="ngbNav" [(activeId)]="defaultNavActiveId" class="nav-tabs"> 
      <li ngbDropdown ngbNavItem *ngIf="showUserList">
        <a href (click)="false" class="nav-link"  ngbDropdownToggle>Usuarios Internos</a>
        <div ngbDropdownMenu>
          <button ngbDropdownItem (click)="pestanaUsuarios()" (click)="FilterBy('contador')">Todos</button>
          <button ngbDropdownItem (click)="pestanaUsuarios()" (click)="FilterBy('Director')">Director</button>
          <button ngbDropdownItem (click)="pestanaUsuarios()" (click)="FilterBy('Supervisor')">Supervisor</button>
          <button ngbDropdownItem (click)="pestanaUsuarios()" (click)="FilterBy('Contador Platino')">Contador Platino</button>
          <button ngbDropdownItem (click)="pestanaUsuarios()" (click)="FilterBy('Contador Oro')">Contador Oro</button>
          <button ngbDropdownItem (click)="pestanaUsuarios()" (click)="FilterBy('Contador Plata')">Contador Plata</button>
        </div>
      </li>      
      <li [ngbNavItem]="1" *ngIf="showUserList">
        <!-- <a ngbNavLink (click)="FilterBy('contador')">Contadores</a> -->
        <ng-template ngbNavContent>
          <div class="row">
            <div class="col-md-12 stretch-card">
              <div class="card">
                <div class="card-body">
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="feather icon-search"></i>
                      </div>
                    </div>
                    <input type="text" class="form-control" placeholder="Buscar" (keyup)="SearchByContador($event)">
                  </div> 
                  <div class="table-responsive">
                    <ngx-datatable
                    #table
                    class="bootstrap"
                    [rows]="users"
                    [loadingIndicator]="loadingIndicator"
                    [columnMode]="ColumnMode.force"
                    [headerHeight]="50"
                    [footerHeight]="50"
                    [rowHeight]="50"
                    [limit]="20"
                    [scrollbarH]="true"
                    [columns]="columns"
                    >
                      <ngx-datatable-column name="ID" [width]="50"></ngx-datatable-column>
                      <ngx-datatable-column name="Correo electrónico" [width]="200" prop="correo"></ngx-datatable-column>
                      <ngx-datatable-column name="Nombres" [width]="200"></ngx-datatable-column>
                      <ngx-datatable-column name="Apellidos" [width]="200"></ngx-datatable-column>
                      <ngx-datatable-column name="Rol" [width]="150" prop="rol"></ngx-datatable-column>
                      <ngx-datatable-column name="Alta" [width]="200" prop="fechaalta"></ngx-datatable-column>        
                      <ngx-datatable-column name="Acciones" [width]="150" prop="id">
                        <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                          <span>
                            <button class="btn btn-secondary btn-icon" routerLink="/general/perfil/{{value}}">
                              <i class="feather icon-edit-3"></i>
                            </button>
                            <button class="btn btn-danger btn-icon">
                              <i class="feather icon-x"></i>
                            </button>
                          </span>
                        </ng-template>
                      </ngx-datatable-column>  
                    </ngx-datatable>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </li>
      <li [ngbNavItem]="2">
        <a ngbNavLink (click)="FilterBy('cliente')" (click)="pestanaClientes()">Clientes</a>
        <ng-template ngbNavContent>          
          <div class="row">
            <div class="col-md-12 stretch-card">
              <div class="card">
                <div class="card-body">
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <div class="input-group-text">
                        <i class="feather icon-search"></i>
                      </div>
                    </div>
                    <input type="text" class="form-control" placeholder="Buscar por nombres, apellidos, razón social o rfc" (keyup)="SearchByCliente($event)">
                  </div>
                  <div class="table-responsive">
                    <ngx-datatable
                    #table
                    class="bootstrap"
                    [rows]="users"
                    [loadingIndicator]="loadingIndicator"
                    [columnMode]="ColumnMode.force"
                    [headerHeight]="50"
                    [footerHeight]="50"
                    [rowHeight]="50"
                    [limit]="20"
                    [scrollbarH]="true"
                    [columns]="columns"
                    >
                      <ngx-datatable-column name="ID" [width]="50"></ngx-datatable-column>
                      <ngx-datatable-column name="Correo electrónico" [width]="200" prop="correo"></ngx-datatable-column>
                      <ngx-datatable-column name="Nombres" [width]="200"></ngx-datatable-column>
                      <ngx-datatable-column name="Apellidos" [width]="200"></ngx-datatable-column>
                      <ngx-datatable-column name="RFC" [width]="150" prop="rfc"></ngx-datatable-column>
                      <ngx-datatable-column name="Razón Social" [width]="150" prop="razonsocial"></ngx-datatable-column>
                      <ngx-datatable-column name="Plan" [width]="150" prop="plan"></ngx-datatable-column>
                      <ngx-datatable-column name="Alta" [width]="200" prop="fechaalta"></ngx-datatable-column>        
                      <ngx-datatable-column name="Acciones" [width]="170" prop="id">
                        <ng-template let-row="row" let-value="value" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                          <span>
                            <button class="btn btn-secondary btn-icon" routerLink="/general/perfil/{{value}}" ngbTooltip="Editar Usuario">
                              <i class="feather icon-edit-3"></i>
                            </button>
                            <button class="btn btn-danger btn-icon" *ngIf="LowRols" ngbTooltip="Desactivar este usuario">
                              <i class="feather icon-x"></i>
                            </button>
                            <button class="btn btn-success btn-icon" *ngIf="LowRols" ngbTooltip="Asignar este cliente a un contador" (click)="AsignarUsuario(asignarModal,rowIndex)">
                              <i class="feather icon-user-check"></i>
                            </button>
                          </span>
                        </ng-template>
                      </ngx-datatable-column>  
                    </ngx-datatable>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ng-template>
      </li>
      <li ngbNavItem class="ml-auto" *ngIf="mostrarBoton === 'usuario'">
        <a class="btn btn-primary" type="button" routerLink="/general/users/newuser">Nuevo Usuario</a>
      </li>
      <li ngbNavItem class="ml-auto" *ngIf="mostrarBoton === 'cliente'" >
        <a class="btn btn-primary" type="button" routerLink="/general/newcliente">Nuevo Cliente</a>
      </li>
    </ul>
    <div [ngbNavOutlet]="defaultNav" class="mt-3"></div>
    <!-- <div class="input-group dashboard-date mr-2 mb-2 mb-md-0 d-md-none d-xl-flex">
      <a class="btn btn-success btn-icon" type="button" (click)="FilterBy('contador')">
        Contadores
      </a>
      <a class="btn btn-danger btn-icon ml-2" type="button" (click)="FilterBy('cliente')">
        Clientes
      </a>
    </div> -->
  </div>
  <!-- <div class="d-flex align-items-center flex-wrap text-nowrap">
    <div class="input-group dashboard-date mr-2 mb-2 mb-md-0 d-md-none d-xl-flex">
      <div class="input-group-prepend">
        <a class="btn btn-success btn-icon calendar" type="button" routerLink="/general/users/newuser">
          Nuevo
        </a>
      </div>
    </div>
  </div> -->
</div>

<ng-template #asignarModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Asignar este cliente a un contador</h5>
    <button type="button" class="close" (click)="modal.close('by: close icon')" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-12 stretch-card">
        <div class="card">
          <div class="card-body">
            <form>
              <div class="row" >
                <div class="col-sm-12">
                  <div class="form-group">
                    <label class="control-label">Contadores {{users[index].plan}}</label>
                    <ng-select 
                      [items]="UsuariosDisponibles"
                      bindLabel="label"
                      bindValue="id"
                      placeholder="Seleccionar Contador"
                      [(ngModel)]="asignadoa"
                      [ngModelOptions]="{standalone: true}">
                    </ng-select>  
                  </div>
                </div><!-- Col -->
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer" *blockUI="'asignarcontador'">
    <button type="button" class="btn btn-primary" (click)="Asignar(index)">Guardar</button>
    <button type="button" class="btn btn-secondary" (click)="modal.close('by: close button')">Cancelar</button>    
  </div>
</ng-template>
